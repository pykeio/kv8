[workspace]
members = [ "crates/serde_kv8", "crates/kv8-dynamic" ]

[workspace.package]
version = "152.2.1"
license = "MIT"
edition = "2024"
rust-version = "1.95"

[package]
name = "kv8"
version.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true
include = ["/src", "/build.rs", "/build"]
links = "kv8"

[lib]
name = "v8"

[features]
default = ["use_custom_libcxx"]
use_custom_libcxx = []

[dependencies]
bitflags = "2.5"

[dev-dependencies]
bytes = "1"
align-data = "0.1.0"
trybuild = "1.0.96"
rustversion = "1"
